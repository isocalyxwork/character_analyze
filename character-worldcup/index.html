<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>캐릭터 이상형 월드컵 · 취향 유형 테스트</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">

</head>
<body>
<div class="wrap">

  <!-- 1. 시작 화면 -->
  <section class="screen active" id="s-intro">
    <div class="intro">
      <div class="slot" id="intro-img">대표 이미지 자리</div>
      <h1 id="intro-title"></h1>
      <p id="intro-desc"></p>
      <div class="rounds" id="round-pick"></div>
      <button class="btn" id="start">시작하기</button>
    </div>
  </section>

  <!-- 2. 대결 화면 -->
  <section class="screen" id="s-match">
    <div class="top">
      <div class="round-label" id="round-label"></div>
      <div class="count" id="count"></div>
    </div>
    <div class="bar"><i id="progress"></i></div>
    <div class="versus">
      <button class="pick" id="pick-a"></button>
      <div class="vs">VS</div>
      <button class="pick" id="pick-b"></button>
    </div>
    <div class="match-foot">
      <button class="btn ghost small" id="undo">← 이전 선택 되돌리기</button>
    </div>
  </section>

  <!-- 3. 결과 화면 -->
  <section class="screen" id="s-result">
    <div class="result-head">
      <div class="eyebrow">당신의 취향 유형은</div>
      <div class="code" id="r-code"></div>
      <div class="type-title" id="r-title"></div>
    </div>

    <div class="panel">
      <h4>유형 설명</h4>
      <div class="type-body">
        <div class="slot" id="r-type-img">유형 이미지 자리</div>
        <p id="r-desc"></p>
      </div>
    </div>

    <div class="panel">
      <h4>취향 성향 분석</h4>
      <div id="r-axes"></div>
    </div>

    <div class="panel">
      <h4>🏆 최종 우승 캐릭터</h4>
      <div class="winner" id="r-winner"></div>
    </div>

    <div class="panel">
      <h4>TOP 4</h4>
      <div class="rank" id="r-rank"></div>
    </div>

    <div class="actions">
      <button class="btn" id="retry">다시 하기</button>
      <button class="btn ghost" id="copy">결과 복사하기</button>
    </div>
  </section>
</div>
<div class="toast" id="toast"></div>

<script src="data.js"></script>
<script src="script.js"></script>
</body>
</html>
